# Este arquivo precisa ficar em `.github/workflows/` na RAIZ do repositorio.
# O GitHub Actions nao le workflows de subdiretorios: enquanto o arquivo esteve
# em `apps/rails/.github/workflows/` ele nunca executou (BRES-101).
#
# O app Rails vive em `apps/rails` e o app Expo em `apps/mobile`, entao todo job
# declara o proprio `working-directory`.
name: CI

on:
  pull_request:
  push:
    branches: [ master ]

jobs:
  scan_ruby:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/rails

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/rails
          bundler-cache: true

      - name: Scan for common Rails security vulnerabilities using static analysis
        run: bin/brakeman --no-pager

      - name: Scan for known security vulnerabilities in gems used
        run: bin/bundler-audit

  lint:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/rails

    env:
      RUBOCOP_CACHE_ROOT: tmp/rubocop

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/rails
          bundler-cache: true

      - name: Prepare RuboCop cache
        uses: actions/cache@v4
        env:
          DEPENDENCIES_HASH: ${{ hashFiles('apps/rails/.ruby-version', 'apps/rails/.rubocop.yml', 'apps/rails/.rubocop_todo.yml', 'apps/rails/Gemfile.lock') }}
        with:
          path: apps/rails/${{ env.RUBOCOP_CACHE_ROOT }}
          key: rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-${{ github.ref_name == github.event.repository.default_branch && github.run_id || 'default' }}
          restore-keys: |
            rubocop-${{ runner.os }}-${{ env.DEPENDENCIES_HASH }}-

      - name: Lint code for consistent style
        run: bin/rubocop -f github

  test:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/rails

    services:
      # PostGIS, nao o postgres puro: `selling_locations.lonlat` e uma coluna
      # `geography` e o `db/structure.sql` comeca criando a extensao.
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: --health-cmd="pg_isready" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
      - name: Install packages
        # `psql` carrega o `db/structure.sql` (schema_format :sql) e precisa ser
        # da mesma serie do servidor: 16.
        run: sudo apt-get update && sudo apt-get install --no-install-recommends -y libpq-dev libvips postgresql-client

      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          working-directory: apps/rails
          bundler-cache: true

      - name: Run tests
        env:
          RAILS_ENV: test
          DATABASE_HOST: localhost
          DATABASE_PORT: 5432
          DATABASE_USERNAME: postgres
          DATABASE_PASSWORD: postgres
          TEST_DATABASE_NAME: marmitas_top_test
          # Valor descartavel: o initializer do devise se recusa a subir sem a
          # variavel, e nenhum teste depende do conteudo da chave.
          DEVISE_JWT_SECRET_KEY: ci-only-not-a-real-secret
        run: bin/rails db:test:prepare test

  mobile:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/mobile

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # O passo `npx tsc --noEmit` entra aqui quando a BRES-134 corrigir os 3
      # erros de tipo que existem desde antes da reestruturacao do repositorio.
