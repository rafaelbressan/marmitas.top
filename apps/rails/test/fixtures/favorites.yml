# `favoritable` e polimorfico: o tipo vai entre parenteses no rotulo.
# Os contadores em seller_profiles.yml e dishes.yml acompanham estes registros.

carla_segue_marli:
  user: carla
  favoritable: marli_marmitas (SellerProfile)

carla_curte_feijoada:
  user: carla
  favoritable: feijoada (Dish)

# Favorito de outra conta: prova que `destroy` escopado por `current_user.favorites`
# nao acha o id alheio (BRES-102).
marli_curte_algo:
  user: marli
  favoritable: carne_de_panela (Dish)
