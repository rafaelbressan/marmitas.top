# A coluna `lonlat` e `geography(4326)` e as fixtures entram direto no banco,
# sem passar pelo callback `update_lonlat_from_coordinates` do modelo. Por isso o
# valor vai escrito a mao em EWKT — `SRID=4326;POINT(<longitude> <latitude>)`,
# longitude primeiro. Sem isso a coluna fica NULL e todo `ST_DWithin` some.

largo_do_machado:
  seller_profile: marli_marmitas
  name: Largo do Machado
  address: Largo do Machado, Catete
  latitude: -22.929500
  longitude: -43.177400
  lonlat: "SRID=4326;POINT(-43.1774 -22.9295)"
  notes: Do lado da banca de jornal, das 11h as 14h.

